<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">Vibee — почувствовать команду, сделать следующий шаг</title>
  <desc id="desc">Тёмный технологичный баннер с жёлтой пчёлкой, сотами и карточками командных сигналов.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.62" stop-color="#171b29"/>
      <stop offset="1" stop-color="#25202a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd329" stop-opacity=".32"/>
      <stop offset="1" stop-color="#ff9e2c" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="hex" width="72" height="62" patternUnits="userSpaceOnUse">
      <path d="M18 2 35 11v20L18 40 1 31V11zM54 33l17 9v20l-17 9-17-9V42z" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1280" height="390" rx="30" fill="url(#bg)"/>
  <rect width="1280" height="390" rx="30" fill="url(#hex)"/>
  <circle cx="1050" cy="190" r="235" fill="url(#glow)"/>
  <path d="M0 326c190-67 312 50 507-7s313-36 486 5 213 16 287-7v73H0z" fill="#ffd329" fill-opacity=".055"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="74" y="67" width="186" height="31" rx="15.5" fill="#ffd329" fill-opacity=".13" stroke="#ffd329" stroke-opacity=".28"/>
    <circle cx="93" cy="82.5" r="4" fill="#ffd329"/>
    <text x="107" y="88" fill="#ffe57c" font-size="13" font-weight="700" letter-spacing="2.1">TEAM SIGNALS, WITH CARE</text>
    <text x="70" y="192" fill="#fff" font-size="76" font-weight="800" letter-spacing="-4">Vibee</text>
    <text x="74" y="236" fill="#ffd329" font-size="27" font-weight="700">Почувствовать команду.</text>
    <text x="74" y="273" fill="#ffd329" font-size="27" font-weight="700">Сделать следующий шаг.</text>
    <text x="76" y="324" fill="#d2d6df" font-size="16">Бережные сигналы для разговора — без персональных рейтингов.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="855" y="80" width="278" height="84" rx="18" fill="#fff" fill-opacity=".96"/>
    <circle cx="889" cy="122" r="17" fill="#fff2b6"/>
    <path d="M883 123h12m-6-6v12" stroke="#b98100" stroke-width="2.5" stroke-linecap="round"/>
    <text x="919" y="116" fill="#252936" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Общий ритм</text>
    <text x="919" y="140" fill="#687080" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">только командные агрегаты</text>
    <rect x="904" y="182" width="286" height="91" rx="18" fill="#fff" fill-opacity=".98"/>
    <circle cx="939" cy="227" r="17" fill="#e4f5ec"/>
    <path d="m931 228 6 6 11-14" fill="none" stroke="#248452" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="969" y="220" fill="#252936" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Следующий шаг</text>
    <text x="969" y="244" fill="#687080" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">обсудить и выбрать вместе</text>
  </g>
  <g transform="translate(1127 264) rotate(12)">
    <ellipse cx="24" cy="18" rx="17" ry="8" fill="#fff" fill-opacity=".9" transform="rotate(-28 24 18)"/>
    <ellipse cx="53" cy="17" rx="17" ry="8" fill="#fff" fill-opacity=".9" transform="rotate(28 53 17)"/>
    <ellipse cx="37" cy="39" rx="28" ry="22" fill="#ffd329" stroke="#151515" stroke-width="4"/>
    <path d="M27 20c-5 12-5 25 0 37m13-40c-5 13-5 27 0 42" stroke="#171717" stroke-width="8" stroke-linecap="round"/>
    <circle cx="66" cy="34" r="16" fill="#ffd329" stroke="#151515" stroke-width="4"/>
    <path d="m60 19-3-9m14 11 5-8" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
    <circle cx="63" cy="33" r="2" fill="#171717"/><circle cx="71" cy="33" r="2" fill="#171717"/>
    <path d="M63 40q5 5 9-1" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <circle cx="1196" cy="75" r="4" fill="#ffd329"/><circle cx="1213" cy="92" r="2.5" fill="#fff" fill-opacity=".6"/>
  <circle cx="829" cy="296" r="3" fill="#ffd329"/><circle cx="800" cy="112" r="2" fill="#fff" fill-opacity=".55"/>
</svg>
