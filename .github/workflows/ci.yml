name: CI
on:
  push:
    branches: [main, develop, feat/august-core]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r bot/requirements.txt
      - run: npm run check
      - run: python -m unittest discover -s bot/tests -v
      - run: python -m bot --check
