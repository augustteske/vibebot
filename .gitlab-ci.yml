image: node:24-bookworm-slim

stages:
  - verify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

verify:
  stage: verify
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run check
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

verify-bot:
  stage: verify
  # Python 3.12 нужен боту, Node 24 — локальному API в test_http_integration.py.
  # Node ставится из официального дистрибутива nodejs.org с проверкой SHA-256.
  image: python:3.12-slim
  before_script:
    - apt-get update
    - apt-get install --no-install-recommends --yes ca-certificates curl xz-utils
    - sh scripts/install-node.sh
    - python -m pip install --disable-pip-version-check -r bot/requirements.txt
  script:
    - python -m unittest discover -s bot/tests -v
    - python -m bot --check
